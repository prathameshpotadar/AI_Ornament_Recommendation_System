<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ornament Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="chat-body">

  <div class="chat-container fade-in">
    <h1 class="chat-title glow-text">💎 AI Ornament Assistant</h1>

    <div id="chat-box" class="chat-box">
      <div class="bot-message message fade-in">
        👋 Hello! I’m your Ornament Assistant. Would you like Gold or Silver ornaments?
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your answer here..." autofocus />
      <button id="send-btn" class="btn-glow">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(message, sender) {
      const div = document.createElement("div");
      div.classList.add("message", sender === "bot" ? "bot-message" : "user-message", "fade-in");
      div.innerHTML = message;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      userInput.value = "";

      appendMessage('<div class="typing"><span></span><span></span><span></span></div>', "bot");

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const data = await res.json();
      document.querySelector(".typing")?.parentNode.remove();
      appendMessage(data.reply, "bot");
    }

    sendBtn.onclick = sendMessage;
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
